<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sleep Sound Control</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .control {
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        p {
            margin-top: 8px;
            color: #555;
        }

        #status {
            margin-top: 30px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h1>Sleep Sound Control</h1>

    <div class="control">
        <button onclick="callAPI('/api/vup')">
            Louder
        </button>
        <p>Increase the volume.</p>
    </div>

    <div class="control">
        <button onclick="callAPI('/api/vdown')">
            Quieter
        </button>
        <p>Decrease the volume.</p>
    </div>

    <div class="control">
        <button onclick="callAPI('/api/tup')">
            Tone Increase
        </button>
        <p>Increase the tone of the sound.</p>
    </div>

    <div class="control">
        <button onclick="callAPI('/api/tdown')">
            Tone Decrease
        </button>
        <p>Decrease the tone of the sound.</p>
    </div>

    <div id="status">
        Ready.
    </div>

    <div class="system-info">
      <h3>System</h3>
      <pre id="systemStats">
        CPU: --
        Memory: --
        Thermals: --</pre>
    </div>

    <script>
        async function callAPI(path)
        {
            const status = document.getElementById("status");

            status.textContent = "Calling " + path + "...";
            try {
                const response = await fetch(path, {
                    method: "GET"
                });

                if (!response.ok) {
                    throw new Error(
                        "HTTP " + response.status
                    );
                }

                const text = await response.text();

                // Wait 1 second before displaying the response
                await new Promise(resolve => setTimeout(resolve, 1000));

                status.textContent = text || "OK";
            }
            catch (error) {
                status.textContent =
                    "Error: " + error.message;
            }
        }

        async function updateSystemStats() {
            const stats = document.getElementById("systemStats");

            try {
                const response = await fetch("/api/system");

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                let text = "";

                //text += `CPU:    ${data.cpu_percent.toFixed(1)}%\n`;
                text += `CPU:    ${data.cpu_percent}%\n`;
                text += `Memory: ${data.memory_free.toFixed(2)} GB free / ${data.memory_total.toFixed(2)} GB total\n`;

                if (data.thermals && data.thermals.length > 0) {
                    text += "Thermal:\n";

                    for (const thermal of data.thermals) {
                        text += `  ${thermal.type}: ${thermal.temp.toFixed(1)} °F\n`;
                    }
                } else {
                    text += "Thermal: unavailable\n";
                }

                stats.textContent = text;

            } catch (err) {
                stats.textContent = `System statistics unavailable: ${err.message}`;
            }
        }

      updateSystemStats();
      setInterval(updateSystemStats, 2000);
    </script>

</body>
</html>
